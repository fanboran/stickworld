<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>L3 地区画线切割工具</title>
<style>
  :root { --bg:#1c1e24; --panel:#262a33; --line:#3a3f4c; --txt:#d8dce4; --acc:#4da3ff; --bad:#e06060; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--txt); font: 13px/1.5 "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header .title { font-size: 15px; font-weight: bold; margin-right: 8px; }
  header button, header label.btn { background: #333a46; color: var(--txt); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  header button:hover, header label.btn:hover { background: #3d4554; }
  header button.primary { background: var(--acc); color: #0d1117; border-color: var(--acc); font-weight: bold; }
  header button.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  header button:disabled { opacity: .4; cursor: default; }
  header input[type=file] { display: none; }
  header .mode { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  header .mode span { padding: 4px 10px; cursor: pointer; background: #333a46; user-select: none; }
  header .mode span.on { background: var(--acc); color: #0d1117; font-weight: bold; }
  .hint { font-size: 11px; color: #8a93a3; }
  main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; overflow: hidden; background: #111318; }
  canvas { position: absolute; left: 0; top: 0; }
  #statusBar { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.65); padding: 4px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; }
  aside { width: 300px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside h3 { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  #cutList { flex: 1; overflow-y: auto; padding: 6px; }
  .cut-item { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 6px; padding: 6px 8px; background: #2b303b; display: flex; align-items: center; gap: 8px; }
  .cut-item .swatch { width: 26px; height: 8px; border-radius: 3px; }
  .cut-item .info { flex: 1; }
  .cut-item button { background: #3a4250; color: var(--txt); border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  #help { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: #9aa4b5; line-height: 1.7; }
</style>
</head>
<body>

<header>
  <span class="title">L3 地区画线切割工具</span>
  <label class="btn">底图(编号图) <input type="file" id="fileBase" accept="image/png"></label>
  <label class="btn">取色图(唯一色) <input type="file" id="fileColor" accept="image/png"></label>
  <span style="flex:1"></span>
  <div class="mode" id="modeBox">
    <span data-mode="view" class="on">查看</span>
    <span data-mode="draw">画线</span>
  </div>
  <button id="btnUndo">撤销</button>
  <button id="btnClear">清空</button>
  <button id="btnExport" class="danger">导出 JSON</button>
</header>

<main>
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <div id="statusBar">加载中…</div>
  </div>
  <aside>
    <h3>切割线列表</h3>
    <div id="cutList"><div style="color:#8a93a3;padding:8px">暂无切割线</div></div>
    <div id="help">
      画线模式：按住鼠标左键在图上涂鸦，<br>
      沿你想切开的位置画一条线（可弯曲），<br>
      松开即完成一条切割线。<br>
      可画多条，导出后由算法沿线切开。
    </div>
  </aside>
</main>

// ─────────────────────────── 状态 ───────────────────────────
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let baseImg = null;
let colorImg = null;
let colorPixels = null;
let imgW = 0, imgH = 0;
let scale = 0.5, offX = 0, offY = 0;
let mode = 'view';
let cuts = [];          // 完成线：[[{x,y},...], ...]
let drawing = null;     // 正在画：{points: [], color: str}
const LINE_COLORS = ['#ff5050', '#50ff88', '#50a0ff', '#ffd050', '#ff50ff', '#50ffff', '#ff8850', '#b0ff50'];
let isDown = false, moved = false, downX = 0, downY = 0;

// ─────────────────────────── 加载 ───────────────────────────
function loadImageSrc(src, cb) {
  const img = new Image();
  img.onload = () => cb(img);
  img.onerror = () => alert('图片加载失败');
  img.src = src;
}
function ensureSize() {
  const w = colorImg ? colorImg.width : (baseImg ? baseImg.width : 0);
  const h = colorImg ? colorImg.height : (baseImg ? baseImg.height : 0);
  if (w && h && (cv.width !== w || cv.height !== h)) { cv.width = w; cv.height = h; }
  imgW = w; imgH = h;
}
function applyBase(img) { baseImg = img; ensureSize(); fit(); render(); }
function applyColor(img) {
  colorImg = img;
  ensureSize();
  const c = document.createElement('canvas');
  c.width = imgW; c.height = imgH;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0);
  colorPixels = cx.getImageData(0, 0, imgW, imgH).data;
  fit();
  render();
}
document.getElementById('fileBase').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  loadImageSrc(URL.createObjectURL(f), applyBase);
});
document.getElementById('fileColor').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  loadImageSrc(URL.createObjectURL(f), applyColor);
});
window.addEventListener('DOMContentLoaded', () => {
  if (EMBED_BASE) loadImageSrc(EMBED_BASE, applyBase);
  if (EMBED_COLOR) loadImageSrc(EMBED_COLOR, applyColor);
  render();
});

// ─────────────────────────── 视图变换 ───────────────────────────
function fit() {
  const wrap = document.getElementById('canvasWrap');
  if (!imgW || !imgH) return;
  scale = Math.min(wrap.clientWidth / imgW, wrap.clientHeight / imgH) * 0.92;
  offX = (wrap.clientWidth - imgW * scale) / 2;
  offY = (wrap.clientHeight - imgH * scale) / 2;
}
function screenToImg(mx, my) {
  return { x: (mx - offX) / scale, y: (my - offY) / scale };
}

// ─────────────────────────── 交互 ───────────────────────────
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  isDown = true; moved = false;
  downX = e.clientX; downY = e.clientY;
  cv.setPointerCapture(e.pointerId);
  if (mode === 'draw') {
    const r = cv.getBoundingClientRect();
    const p = screenToImg(e.clientX - r.left, e.clientY - r.top);
    drawing = { points: [{ x: p.x, y: p.y }], color: LINE_COLORS[cuts.length % LINE_COLORS.length] };
    render();
  }
});
cv.addEventListener('pointermove', e => {
  if (mode === 'draw' && drawing) {
    const r = cv.getBoundingClientRect();
    const p = screenToImg(e.clientX - r.left, e.clientY - r.top);
    const last = drawing.points[drawing.points.length - 1];
    // 图像坐标移动超过 1px 才加点（避免点太密）
    if ((p.x - last.x) ** 2 + (p.y - last.y) ** 2 >= 1.0) {
      drawing.points.push({ x: p.x, y: p.y });
      render();
    }
  } else if (isDown) {
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      moved = true;
      offX += dx; offY += dy;
      downX = e.clientX; downY = e.clientY;
      render();
    }
  }
});
cv.addEventListener('pointerup', e => {
  if (!isDown) return;
  isDown = false;
  if (mode === 'draw' && drawing) {
    if (drawing.points.length >= 2) {
      cuts.push(drawing);
      updateList();
      setStatus('切割线 ' + cuts.length + ' 条已保存（可继续画）');
    } else {
      setStatus('线太短，已忽略');
    }
    drawing = null;
    render();
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const old = scale;
  scale = Math.max(0.02, Math.min(20, scale * (e.deltaY < 0 ? 1.15 : 0.87)));
  const k = scale / old;
  offX = mx - (mx - offX) * k;
  offY = my - (my - offY) * k;
  render();
}, { passive: false });

// ─────────────────────────── 操作 ───────────────────────────
document.getElementById('btnUndo').addEventListener('click', () => {
  if (cuts.length === 0) return;
  cuts.pop();
  updateList();
  render();
});
document.getElementById('btnClear').addEventListener('click', () => {
  cuts = [];
  drawing = null;
  updateList();
  render();
});
document.getElementById('btnExport').addEventListener('click', exportJSON);

function updateList() {
  const box = document.getElementById('cutList');
  if (cuts.length === 0) {
    box.innerHTML = '<div style="color:#8a93a3;padding:8px">暂无切割线</div>';
    return;
  }
  box.innerHTML = '';
  cuts.forEach((cut, i) => {
    const div = document.createElement('div');
    div.className = 'cut-item';
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = cut.color;
    const info = document.createElement('div');
    info.className = 'info';
    info.textContent = '线 ' + (i + 1) + '：' + cut.points.length + ' 点';
    const del = document.createElement('button');
    del.textContent = '删';
    del.onclick = () => { cuts.splice(i, 1); updateList(); render(); };
    div.appendChild(sw); div.appendChild(info); div.appendChild(del);
    box.appendChild(div);
  });
}

function exportJSON() {
  if (cuts.length === 0) { alert('还没有切割线'); return; }
  const out = {
    tool: 'region_cut_tool',
    ocean: '#1e375f',
    size: imgW,
    cuts: cuts.map(c => ({
      color: c.color,
      points: c.points.map(p => [Math.round(p.x), Math.round(p.y)]),
    })),
  };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'region_cut_plan.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─────────────────────────── 渲染 ───────────────────────────
function drawLine(points, color, width) {
  if (points.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke();
}
function render() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!baseImg && !colorImg) { setStatus('未加载图片'); return; }
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  if (baseImg) ctx.drawImage(baseImg, 0, 0);
  else if (colorImg) ctx.drawImage(colorImg, 0, 0);
  // 已完成的切割线（白色描边 + 彩色线，醒目）
  for (const cut of cuts) {
    drawLine(cut.points, '#ffffff', 5 / scale);
    drawLine(cut.points, cut.color, 3 / scale);
  }
  // 正在画的线
  if (drawing && drawing.points.length >= 2) {
    drawLine(drawing.points, '#ffffff', 5 / scale);
    drawLine(drawing.points, drawing.color, 3 / scale);
  }
  ctx.restore();
  setStatus('缩放 ' + (scale * 100).toFixed(0) + '% ｜ ' + imgW + '×' + imgH +
    ' ｜ 切割线 ' + cuts.length + ' 条' +
    (mode === 'draw' ? ' ｜ 画线模式：按住左键涂鸦' : ''));
}
function setStatus(s) { document.getElementById('statusBar').textContent = s; }

// ─────────────────────────── 模式切换 ───────────────────────────
document.getElementById('modeBox').addEventListener('click', e => {
  const el = e.target.closest('span[data-mode]');
  if (!el) return;
  mode = el.dataset.mode;
  document.querySelectorAll('#modeBox span').forEach(s => s.classList.toggle('on', s === el));
  drawing = null;
  render();
});
window.addEventListener('resize', () => { fit(); render(); });
</script>
