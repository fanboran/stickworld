<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>组织模拟台——几大系统组织 · 槽位板 · 嵌套与流水线</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101318; --panel: #191d26; --panel2: #20252f; --line: #2c3240;
    --fg: #dde3ec; --dim: #8b93a5; --acc: #4f8cff; --ok: #3fae7a;
    --nest: #e359c4; --flow: #4faee3; --warn: #e0a94f; --bad: #e06c5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  button { background: #2b3ba0; color: #fff; border: 0; border-radius: 6px;
           padding: 4px 9px; font-size: 12px; cursor: pointer; }
  button:hover { background: #3a4cc4; }
  button.ghost { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }
  button.ghost:hover { border-color: var(--acc); }
  button.warn { background: #6e3b3b; }
  button.on { background: #1f7a4d; }
  select, input { background: #12151c; color: var(--fg); border: 1px solid var(--line);
                  border-radius: 5px; padding: 3px 6px; font-size: 12px; }

  /* ── 顶栏 ── */
  #top { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
         background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #top h1 { font-size: 14px; margin-right: 4px; }
  #top .hint { color: var(--dim); font-size: 11px; }
  .res { display: inline-flex; align-items: center; gap: 4px; background: var(--panel2);
         border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px; font-size: 12px; }
  .res b { font-variant-numeric: tabular-nums; }
  .res .rate { color: var(--dim); font-size: 11px; }
  .res.low b { color: var(--bad); }
  #clock { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* ── 主体三栏 ── */
  #main { display: flex; flex: 1; min-height: 0; }
  #left { width: 218px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
          overflow-y: auto; padding: 8px; }
  #left h3, #right h3 { font-size: 12px; color: var(--dim); margin: 8px 0 6px; }
  #left .grp button, #late button { display: block; width: 100%; text-align: left;
                                    margin: 3px 0; padding: 5px 8px; }
  #left details { margin-top: 8px; }
  #left summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  .cost { color: var(--warn); font-size: 11px; }

  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #sites { display: flex; gap: 6px; padding: 6px 10px; flex-wrap: wrap;
           border-bottom: 1px solid var(--line); background: #141821; }
  .site { width: 108px; background: var(--panel2); border: 1px solid var(--line);
          border-radius: 7px; padding: 4px 7px; font-size: 11px; }
  .site .nm { color: var(--dim); }
  .site .bar { height: 6px; background: #0d1016; border-radius: 3px; margin-top: 3px; overflow: hidden; }
  .site .bar i { display: block; height: 100%; background: var(--ok); }
  .site.full .bar i { background: var(--bad); }
  #graphWrap { flex: 1; position: relative; overflow: auto; }
  #edges { position: absolute; inset: 0; pointer-events: none; }
  .org { position: absolute; width: 228px; background: var(--panel2);
         border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 3px 10px #0007; }
  .org.sel { border-color: var(--acc); }
  .org.hall { border-color: var(--warn); }
  .org .hd { display: flex; align-items: center; gap: 6px; padding: 6px 9px 4px;
             border-bottom: 1px solid var(--line); font-weight: 600; font-size: 12.5px; }
  .org .hd .tier { color: var(--dim); font-size: 10.5px; font-weight: 400; margin-left: auto; }
  .org .hd .del { visibility: hidden; margin-left: 4px; padding: 1px 6px; font-size: 10px; }
  .org:hover .hd .del { visibility: visible; }
  .slotrow { display: flex; align-items: center; gap: 5px; padding: 4px 9px; font-size: 11.5px;
             border-bottom: 1px dashed #ffffff0d; cursor: pointer; }
  .slotrow:hover { background: #ffffff08; }
  .slotrow.sel { background: #4f8cff22; }
  .slotrow .fn { flex: none; background: #324059; border-radius: 5px; padding: 1px 7px;
                 color: #bcd0f5; font-size: 11px; }
  .slotrow .fn.mil { background: #59323f; color: #f0c0cd; }
  .slotrow .fn.hall { background: #595032; color: #f0e2bc; }
  .chip { background: #3a4356; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .chip.orgchip { background: var(--nest); color: #fff; }
  .chip.empty { background: transparent; border: 1px dashed var(--line); color: var(--dim); }
  .slotrow .par { color: var(--dim); font-size: 10.5px; margin-left: auto; }
  .org .ft { padding: 3px 9px; color: var(--dim); font-size: 10.5px; display: flex; gap: 8px; }
  .legend { position: sticky; left: 0; bottom: 0; float: right; margin: 6px;
            background: #141821cc; border: 1px solid var(--line); border-radius: 7px;
            padding: 4px 9px; font-size: 11px; color: var(--dim); }
  .legend i { display: inline-block; width: 18px; height: 0; margin-right: 3px;
              vertical-align: middle; border-top: 2px solid; }
  .legend .nest { border-color: var(--nest); border-top-style: dashed; }
  .legend .flow { border-color: var(--flow); }
  .legend .tree { border-color: #5a6274; }

  #right { width: 250px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
           overflow-y: auto; padding: 10px; }
  #right .sec { margin-bottom: 12px; }
  #right .lbl { color: var(--dim); font-size: 11px; margin: 6px 0 3px; }
  #right .row { display: flex; gap: 5px; margin: 4px 0; flex-wrap: wrap; }
  #mobil { border: 1px solid var(--line); border-radius: 8px; padding: 8px;
           background: var(--panel2); margin-bottom: 10px; font-size: 12px; }
  #mobil .val { color: var(--warn); font-weight: 700; }

  /* ── 底部事件流 ── */
  #feed { height: 118px; flex: none; background: #0d1016; border-top: 1px solid var(--line);
          overflow-y: auto; padding: 5px 12px; font-size: 12px; }
  #feed div { padding: 1px 0; color: var(--dim); }
  #feed .t { color: #565f72; margin-right: 8px; font-variant-numeric: tabular-nums; }
  #feed .good { color: var(--ok); } #feed .bad { color: var(--bad); }
  #feed .nest { color: var(--nest); } #feed .flow { color: var(--flow); }
  #knobs { display: none; gap: 6px; flex-wrap: wrap; padding: 6px 12px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  #knobs.show { display: flex; }
  .knob { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
  .knob input { width: 46px; }
</style>
</head>
<body>

<div id="top">
  <h1>组织模拟台</h1>
  <span class="hint">槽位板 · 嵌套 · 制造流水线</span>
  <button id="sp0" class="on">⏸</button><button id="sp1">1×</button>
  <button id="sp10">10×</button><button id="sp100">100×</button>
  <button id="knobBtn" class="ghost">参数</button>
  <button id="resetBtn" class="warn">重开</button>
  <span id="resBar"></span>
  <span id="clock">0.0 时 · 第 1 天</span>
</div>
<div id="knobs">
  <span class="knob">采集/人时 <input id="kGather" type="number" step="0.1" value="0.8"></span>
  <span class="knob">搬运/人时 <input id="kHaul" type="number" step="0.1" value="1.2"></span>
  <span class="knob">加工/人时 <input id="kCraft" type="number" step="0.1" value="0.6"></span>
  <span class="knob">吃饭/人时 <input id="kEat" type="number" step="0.01" value="0.05"></span>
  <span class="knob">糊口/人时 <input id="kSub" type="number" step="0.01" value="0.02"></span>
  <span class="knob">场外堆上限 <input id="kBuf" type="number" step="10" value="40"></span>
  <span class="knob">仓库基础容量 <input id="kCap" type="number" step="50" value="200"></span>
  <span class="knob">每仓库+容量 <input id="kWh" type="number" step="50" value="150"></span>
</div>

<div id="main">
  <div id="left">
    <h3>建组织（挂市政厅下）</h3>
    <div class="grp" id="grpQuick"></div>
    <details><summary>更多职能（自组流水线）</summary>
      <div class="grp" id="grpMore"></div>
    </details>
    <details id="late"><summary>后期组织（低存在感）</summary>
      <button data-org="科研院" data-fn="科研" class="ghost">+ 科研院 <span class="cost">木板×10 · 需在编有人会占位组织技能</span></button>
      <button data-org="常备军" data-fn="训练" class="ghost">+ 常备军 <span class="cost">食物×50 · 训练职能</span></button>
      <button data-org="训练营" data-fn="训练" class="ghost">+ 训练营 <span class="cost">原木×15</span></button>
    </details>
    <h3>建筑（建造队施工）</h3>
    <div class="grp" id="grpBuild"></div>
  </div>

  <div id="center">
    <div id="sites"></div>
    <div id="graphWrap">
      <svg id="edges"></svg>
      <div id="nodes"></div>
      <div class="legend"><i class="nest"></i>嵌套/下辖(机构入驻槽) <i class="flow"></i>制造上下游</div>
    </div>
  </div>

  <div id="right">
    <div id="mobil"></div>
    <div id="selPanel"></div>
  </div>
</div>

<div id="feed"></div>

<script>
"use strict";
/* ═══════════ 职能目录（组织的槽位放什么——本模拟台即组织域设计文档本体） ═══════════ */
const FNS = {
  "采集":  { cat: "采集", paramSite: true },
  "搬运":  { cat: "运输" },
  "施工":  { cat: "建造" },
  "锯木":  { cat: "制造", input: { "原木": 1 },            output: { "木板": 1 } },
  "烧砖":  { cat: "制造", input: { "石料": 1 },            output: { "石砖": 1 } },
  "冶炼":  { cat: "制造", input: { "铁矿石": 1, "木板": 1 }, output: { "铁锭": 1 } },
  "锻造":  { cat: "制造", input: { "铁锭": 1, "木板": 1 },   output: { "铁剑": 1 } },
  "装配":  { cat: "制造", input: { "铁锭": 2, "木板": 3 },   output: { "战车": 1 } },
  "熬制":  { cat: "制造", input: { "草药": 1, "食物": 1 },   output: { "药水": 1 } },
  "军事":  { cat: "市政", hall: true },
  "行政":  { cat: "市政", hall: true },
  "训练":  { cat: "军事" },
  "科研":  { cat: "后期", late: true },
};
const SITES = {
  "农田":  "食物",   "林地": "原木",  "石场": "石料",
  "铁矿脉": "铁矿石", "草药丛": "草药",
};
const QUICK = [
  ["采集队", "采集"], ["运输队", "搬运"], ["建造队", "施工"],
  ["锯木坊", "锯木"], ["窑场", "烧砖"], ["冶炼坊", "冶炼"],
  ["锻造坊", "锻造"], ["车辆工坊", "装配"], ["药剂坊", "熬制"],
];
const MOREFNS = ["采集", "搬运", "施工", "锯木", "烧砖", "冶炼", "锻造", "装配", "熬制", "行政", "军事", "训练"];
// 市政厅固定职能槽板（空槽也画——空槽=该职能未运转；下辖即嵌套：组织入驻对应槽）
const HALL_SLOT_KEYS = ["军事", "行政", "采集", "搬运", "施工", "制造", "训练", "科研"];
const HALL_NEST = {   // 组织首槽 → 入驻市政厅哪个槽
  "采集": "采集", "搬运": "搬运", "施工": "施工",
  "锯木": "制造", "烧砖": "制造", "冶炼": "制造", "锻造": "制造", "装配": "制造", "熬制": "制造",
  "训练": "训练", "科研": "科研",
};
const BUILDS = [
  { b: "仓库",  cost: { "原木": 20, "石料": 10 }, work: 30 },
  { b: "训练营", cost: { "原木": 15, "木板": 5 },  work: 24 },
];
const ORG_COST = {
  "科研院": { res: { "木板": 10 }, prereq: "在编有人会占位组织技能01" },
  "常备军": { res: { "食物": 50 } },
  "训练营": { res: { "原木": 15 } },
};

/* ═══════════ 状态 ═══════════ */
let S;
function reset() {
  S = {
    hours: 0, speed: 0, seq: { p: 0, o: 0 },
    people: [], orgs: {}, order: [],           // order: 创建序（图布局用）
    res: { "食物": 60, "原木": 30, "石料": 20, "铁矿石": 10, "草药": 5,
           "木板": 0, "石砖": 0, "铁锭": 0, "铁剑": 0, "战车": 0, "药水": 0 },
    buf: {},                                    // 场外缓冲堆
    buildings: { "仓库": 0, "训练营": 0 },
    buildOrder: null,                           // {b, work, done}
    mobilized: false, starving: false, stallFed: {},
    sel: null, selSlot: null,                   // {org} {org, fn}
    feed: [], rates: {},
  };
  for (const s of Object.keys(SITES)) S.buf[s] = 0;
  // 开局：出生城市政厅（根，领导=你）——固定职能槽板全画（空槽=未运转），
  // 军事槽挂动员官（耕战一体），其余空着；村民若干待业
  const hall = addOrgRaw("市政厅", 3, "hall");
  for (const key of HALL_SLOT_KEYS)
    hall.slots[key] = { persons: [], institution: "", site: Object.keys(SITES)[0] };
  addPersonRaw("动员官");
  S.people[0].org = "o01";
  hall.slots["军事"].persons = ["p01"];
  for (let i = 0; i < 11; i++) addPersonRaw("村民");
  feed("开局：出生城市政厅（领导＝你），军事槽挂着动员官——耕战一体，村民平时生产、战时皆兵", "good");
}
reset();

const $ = id => document.getElementById(id);
const k = () => ({
  gather: +$("kGather").value || 0.8, haul: +$("kHaul").value || 1.2,
  craft: +$("kCraft").value || 0.6, eat: +$("kEat").value || 0.05,
  sub: +$("kSub").value || 0.02, buf: +$("kBuf").value || 40,
  cap: +$("kCap").value || 200, wh: +$("kWh").value || 150,
});
const capTotal = () => k().cap + S.buildings["仓库"] * k().wh;
const idle = () => S.people.filter(p => !p.org);
const person = pid => S.people.find(p => p.id === pid);

function addPersonRaw(name) {
  S.seq.p += 1;
  S.people.push({ id: "p" + String(S.seq.p).padStart(2, "0"),
                  name: name + String(S.seq.p).padStart(2, "0"), org: "" });
}
function addOrgRaw(name, tier, kind) {
  S.seq.o += 1;
  const id = "o" + String(S.seq.o).padStart(2, "0");
  S.orgs[id] = { id, name: name + (kind === "hall" ? "" : String(S.seq.o).padStart(2, "0")),
                 tier, kind: kind || "", slots: {} };
  S.order.push(id);
  return S.orgs[id];
}
function feed(text, cls) {
  S.feed.push({ t: S.hours, text, cls: cls || "" });
  if (S.feed.length > 160) S.feed.shift();
}

/* ═══════════ 左栏：建组织 / 建筑 ═══════════ */
function renderLeft() {
  $("grpQuick").innerHTML = QUICK.map(([n, f]) =>
    `<button data-org="${n}" data-fn="${f}">+ ${n} <span class="cost">${fnDesc(f)}</span></button>`).join("");
  $("grpMore").innerHTML = MOREFNS.map(f =>
    `<button data-fn="${f}" data-bare="1">+ 建组织（首槽「${f}」） <span class="cost">${fnDesc(f)}</span></button>`).join("");
  $("grpBuild").innerHTML = BUILDS.map(b =>
    `<button data-build="${b.b}" class="ghost">建 ${b.b} <span class="cost">${costStr(b.cost)} · ${b.work}人时</span></button>`).join("")
    + `<div class="cost" id="bprog">${S.buildOrder ? `施工中：${S.buildOrder.b} ${(100 * S.buildOrder.done / S.buildOrder.work).toFixed(0)}%` : ""}</div>`;
}
function fnDesc(f) {
  const d = FNS[f];
  if (d.input) return Object.keys(d.input).map(x => d.input[x] + x).join("+") + "→" +
                   Object.keys(d.output).map(x => d.output[x] + x).join("+");
  return d.cat;
}
function costStr(c) { return Object.entries(c).map(([r, n]) => n + r).join(" "); }

function createOrg(name, fn) {
  const cost = ORG_COST[name];
  if (cost) {
    if (cost.res && !canPay(cost.res)) { feed(`建「${name}」资源不足（${costStr(cost.res)}）`, "bad"); return; }
    if (cost.prereq) { feed(`「${name}」明面前提未满足：${cost.prereq}（后期低存在感项）`, "bad"); return; }
    pay(cost.res);
  }
  const o = addOrgRaw(name, 2, "");
  o.slots[fn] = { persons: [], institution: "", site: Object.keys(SITES)[0] };
  // 下辖即嵌套：新组织整体入驻市政厅对应职能槽
  const hall = S.orgs.o01;
  const hostKey = HALL_NEST[fn];
  if (hostKey && hall && hall.slots[hostKey] && !hall.slots[hostKey].institution) {
    hall.slots[hostKey].institution = o.id;
    feed(`组建 ${o.name}，整体入驻市政厅「${hostKey}」槽（下辖即嵌套）`, "good");
  } else {
    feed(`组建 ${o.name}（市政厅「${hostKey || "?"}」槽已有机构——可经槽面板换入驻）`, hostKey ? "bad" : "good");
  }
  S.sel = o.id; S.selSlot = null;
  renderAll();
}

// 左栏事件委托（innerHTML 重渲染不丢绑定）
$("left").addEventListener("click", ev => {
  const el = ev.target.closest("button[data-fn], button[data-build]");
  if (!el) return;
  if (el.dataset.build) {
    const b = BUILDS.find(x => x.b === el.dataset.build);
    if (S.buildOrder) { feed("建造队已有在建工程", "bad"); return; }
    if (!canPay(b.cost)) { feed(`建「${b.b}」资源不足（${costStr(b.cost)}）`, "bad"); return; }
    pay(b.cost);
    S.buildOrder = { b: b.b, work: b.work, done: 0 };
    feed(`开工 ${b.b}（${costStr(b.cost)} 已扣，建造队人手推进）`, "good");
    renderAll();
    return;
  }
  createOrg(el.dataset.org || "组织", el.dataset.fn);
});
function canPay(c) { return Object.entries(c).every(([r, n]) => S.res[r] >= n); }
function pay(c) { for (const [r, n] of Object.entries(c)) S.res[r] -= n; }

/* ═══════════ 经济推进（每拍） ═══════════ */
function membersOf(o) {
  let n = 0; for (const s of Object.values(o.slots)) n += s.persons.length; return n;
}
// 槽挂机构 = 结构性入驻：宿主槽不重复产（机构的自有职能槽干活）
function advance(dt) {
  const K = k();
  const mult = (S.mobilized ? 0.5 : 1) * (S.starving ? 0.5 : 1);
  const flow = {}; for (const r of Object.keys(S.res)) flow[r] = 0;
  // 采集 → 场外缓冲堆（不经采集队之手入库——搬运组织的物理意义）
  for (const o of Object.values(S.orgs)) for (const [fn, slot] of Object.entries(o.slots)) {
    if (fn !== "采集" || !slot.site || slot.institution) continue;
    const w = slot.persons.length; if (!w) continue;
    const amt = K.gather * w * mult * dt;
    const room = K.buf - S.buf[slot.site];
    const got = Math.min(amt, Math.max(0, room));
    S.buf[slot.site] += got; flow[SITES[slot.site]] += got;
    const stalled = amt > got + 1e-9;
    if (stalled && !S.stallFed[slot.site]) {
      S.stallFed[slot.site] = true;
      feed(`${slot.site}缓冲堆满，采集停摆（组建/加强运输队）`, "bad");
    } else if (!stalled) S.stallFed[slot.site] = false;
  }
  // 搬运：场外堆 → 仓库（运输组织存在的物理意义）
  let haulCap = 0;
  for (const o of Object.values(S.orgs)) for (const [fn, slot] of Object.entries(o.slots)) {
    if (fn !== "搬运" || slot.institution) continue;
    const w = slot.persons.length;
    if (w) haulCap += K.haul * w * mult * dt;
  }
  if (haulCap > 0) {
    let totalBuf = 0; for (const s of Object.keys(SITES)) totalBuf += S.buf[s];
    const move = Math.min(haulCap, totalBuf, Math.max(0, capTotal() - resTotal()));
    if (move > 0) for (const s of Object.keys(SITES)) {
      const part = totalBuf > 0 ? S.buf[s] / totalBuf : 0;
      const m = move * part; S.buf[s] -= m; S.res[SITES[s]] += m;
    }
  }
  // 制造：入库原料 → 制品（缺氧式上下游，同吃仓库）
  for (const o of Object.values(S.orgs)) for (const [fn, slot] of Object.entries(o.slots)) {
    const d = FNS[fn]; if (!d || !d.input || slot.institution) continue;
    const w = slot.persons.length; if (!w) continue;
    let batches = K.craft * w * mult * dt;
    const have = Object.entries(d.input).map(([r, n]) => S.res[r] / n);
    const canDo = Math.min(batches, ...have);
    if (canDo > 0) {
      for (const [r, n] of Object.entries(d.input)) { S.res[r] -= n * canDo; flow[r] -= n * canDo; }
      for (const [r, n] of Object.entries(d.output)) { S.res[r] += n * canDo; flow[r] += n * canDo; }
      batches -= canDo;
    }
  }
  // 施工
  if (S.buildOrder) {
    let w = 0;
    for (const o of Object.values(S.orgs)) for (const [fn, slot] of Object.entries(o.slots))
      if (fn === "施工" && !slot.institution) w += slot.persons.length;
    if (w) {
      S.buildOrder.done += w * mult * dt;
      if (S.buildOrder.done >= S.buildOrder.work) {
        S.buildings[S.buildOrder.b] += 1;
        feed(`${S.buildOrder.b} 落成（建造队交付）`, "good");
        S.buildOrder = null; renderLeft();
      }
    }
  }
  // 吃饭与糊口（待业村民自带糊口产出——组织化才有剩余）
  const eat = S.people.length * K.eat * dt;
  const sub = idle().length * K.sub * dt;
  S.res["食物"] += sub - eat; flow["食物"] += sub - eat;
  const starve = S.res["食物"] <= 0;
  if (starve && S.res["食物"] < 0) S.res["食物"] = 0;
  if (starve !== S.starving) {
    S.starving = starve;
    feed(starve ? "粮仓见底：全民干活变慢（机制后果，不硬阻断）" : "粮食恢复，产出回归", starve ? "bad" : "good");
  }
  S.rates = flow;
}

/* ═══════════ 右栏：动员与选中面板 ═══════════ */
function renderRight() {
  const milStaffed = (() => {
    const hall = S.orgs.o01; if (!hall) return false;
    return (hall.slots["军事"] || {}).persons?.length > 0;
  })();
  const war = S.mobilized ? S.people.filter(p => p.name.startsWith("村民")).length : 0;
  $("mobil").innerHTML =
    `<b>耕战一体</b>（动员官在市政厅军事槽 ${milStaffed ? "✓" : "✗缺位"}）<br>` +
    (S.mobilized
      ? `<span class="val">战备中：民兵 ${war} 人</span>，各组织产率减半 <button id="demob" class="ghost">解除动员</button>`
      : `平时生产、战时皆兵 <button id="mobilBtn" ${milStaffed ? "" : "disabled"}>动员</button>`);
  const mb = $("mobilBtn"); if (mb) mb.onclick = () => { S.mobilized = true; feed("动员令下：转入战备，产率减半", "warn"); renderAll(); };
  const db = $("demob"); if (db) db.onclick = () => { S.mobilized = false; feed("解除动员，回到生产", "good"); renderAll(); };

  const sp = $("selPanel");
  if (!S.sel || !S.orgs[S.sel]) {
    sp.innerHTML = `<div class="lbl">点左侧建组织，或点图中组织卡片</div>
      <div class="lbl" style="margin-top:10px">视图说明</div>
      <div style="color:var(--dim);font-size:11.5px">
      每张组织卡＝槽位板：槽位里放<b>人</b>（在编）或塞<b>机构</b>（组织嵌套，品红虚线）；
      制造组织的上下游以蓝线标注（锯木坊→木板→冶炼坊…）；灰线＝市政厅下辖。</div>`;
    return;
  }
  const o = S.orgs[S.sel];
  let html = `<h3>${o.name} <span class="tier">L${o.tier}</span></h3>`;
  if (o.kind === "hall") html += `<div class="lbl">城市根组织 · 领导＝你 · 固定职能槽板（空槽=未运转，可派人顶岗或入驻机构）</div>`;
  html += `<div class="lbl">职能槽（点图中槽行同效）</div>`;
  for (const [fn, slot] of Object.entries(o.slots)) {
    html += `<div class="row"><span class="fn" style="background:#324059;border-radius:5px;padding:1px 7px;color:#bcd0f5">${fn}</span>
      <span style="color:var(--dim);font-size:11px">${slotDesc(o, fn, slot)}</span></div>`;
  }
  if (o.kind !== "hall") {
    html += `<div class="row"><select id="addFn">${MOREFNS.filter(f => !o.slots[f]).map(f => `<option>${f}</option>`).join("")}</select>
             <button id="addSlot" class="ghost">加职能槽</button></div>`;
    html += `<div class="row"><button id="delOrg" class="warn ghost">解散组织（人员回待业）</button></div>`;
  }
  if (S.selSlot && o.slots[S.selSlot]) html += slotPanel(o, S.selSlot);
  sp.innerHTML = html;
  const addSlotBtn = $("addSlot");
  if (addSlotBtn) addSlotBtn.onclick = () => {
    const f = $("addFn").value;
    o.slots[f] = { persons: [], institution: "", site: Object.keys(SITES)[0] };
    feed(`${o.name} 开「${f}」职能槽（未标注职能无明面前提）`, "good"); renderAll();
  };
  const delBtn = $("delOrg");
  if (delBtn) delBtn.onclick = () => {
    for (const slot of Object.values(o.slots)) for (const pid of slot.persons) person(pid).org = "";
    delete S.orgs[o.id]; S.order = S.order.filter(x => x !== o.id);
    for (const other of Object.values(S.orgs))
      for (const slot of Object.values(other.slots)) if (slot.institution === o.id) slot.institution = "";
    feed(`解散 ${o.name}（人员回待业）`); S.sel = null; renderAll();
  };
  bindSlotPanel(o);
}
function slotDesc(o, fn, slot) {
  if (slot.institution) return "机构·" + (S.orgs[slot.institution]?.name || "?");
  if (slot.persons.length) return slot.persons.length + " 人";
  return "空";
}
function slotPanel(o, fn) {
  const slot = o.slots[fn];
  let h = `<div class="sec" style="border-top:1px solid var(--line);padding-top:8px">
           <div class="lbl">槽「${fn}」</div>`;
  h += `<div class="lbl">槽上人员：${slot.persons.map(p => person(p)?.name).join("、") || "无"}</div>`;
  const candidates = idle();
  h += `<div class="row"><select id="pickPerson"><option value="">选待业村民…</option>
        ${candidates.map(p => `<option value="${p.id}">${p.name}</option>`).join("")}</select>
        <button id="putPerson" class="ghost">派入槽</button></div>`;
  if (slot.persons.length) h += `<div class="row"><button id="pullPersons" class="ghost">撤出全部人员</button></div>`;
  const others = S.order.filter(id => id !== o.id && S.orgs[id]);
  h += `<div class="row"><select id="pickOrg"><option value="">选组织塞为机构…</option>
        ${others.map(id => `<option value="${id}">${S.orgs[id].name}</option>`).join("")}</select>
        <button id="putOrg" class="ghost">塞机构入槽</button></div>`;
  if (slot.institution) h += `<div class="row"><button id="pullOrg" class="ghost">撤出机构</button></div>`;
  if (FNS[fn].paramSite) h += `<div class="row"><select id="pickSite">
        ${Object.keys(SITES).map(s => `<option ${slot.site === s ? "selected" : ""}>${s}</option>`).join("")}
        </select><span class="lbl" style="margin:0">采集点</span></div>`;
  h += `<div class="row"><button id="rmSlot" class="warn ghost">拆此槽</button></div></div>`;
  return h;
}
function bindSlotPanel(o) {
  const fn = S.selSlot; if (!fn || !o.slots[fn]) return;
  const slot = o.slots[fn];
  $("putPerson").onclick = () => {
    const v = $("pickPerson").value; if (!v) return;
    slot.persons.push(v); person(v).org = o.id;
    feed(`${person(v).name} 入 ${o.name}「${fn}」槽（在编）`, "good"); renderAll();
  };
  const pp = $("pullPersons"); if (pp) pp.onclick = () => {
    for (const pid of slot.persons) person(pid).org = "";
    slot.persons = []; renderAll();
  };
  $("putOrg").onclick = () => {
    const v = $("pickOrg").value; if (!v) return;
    if (createsNestCycle(o.id, v)) { feed("嵌套成环：拒绝（A 的槽放 B、B 又套 A）", "bad"); return; }
    slot.persons = []; slot.institution = v;
    feed(`${S.orgs[v].name} 整体塞进 ${o.name} 的「${fn}」槽——以组织形态运转该职能（嵌套）`, "nest");
    renderAll();
  };
  const po = $("pullOrg"); if (po) po.onclick = () => { slot.institution = ""; renderAll(); };
  const ps = $("pickSite"); if (ps) ps.onchange = () => { slot.site = ps.value; renderAll(); };
  $("rmSlot").onclick = () => {
    for (const pid of slot.persons) person(pid).org = "";
    delete o.slots[fn]; S.selSlot = null; renderAll();
  };
}
function createsNestCycle(hostId, instId) {
  const seen = new Set(); const q = [instId];
  while (q.length) {
    const cur = q.shift();
    if (cur === hostId) return true;
    if (seen.has(cur)) continue; seen.add(cur);
    for (const slot of Object.values(S.orgs[cur]?.slots || {}))
      if (slot.institution) q.push(slot.institution);
  }
  return false;
}

/* ═══════════ 顶栏资源 ═══════════ */
const RES_ORDER = ["食物", "原木", "石料", "铁矿石", "草药", "木板", "石砖", "铁锭", "铁剑", "战车", "药水"];
function resTotal() { return RES_ORDER.reduce((a, r) => a + S.res[r], 0); }
function renderRes() {
  $("resBar").innerHTML = RES_ORDER.map(r => {
    const v = S.res[r], rate = S.rates[r] || 0;
    const low = r === "食物" && v < 10;
    return `<span class="res ${low ? "low" : ""}">${r} <b>${Math.floor(v)}</b>
            <span class="rate">${rate >= 0 ? "+" : ""}${rate.toFixed(1)}/时</span></span>`;
  }).join("") + `<span class="res">仓库 <b>${Math.floor(resTotal())}</b><span class="rate">/${capTotal()}</span></span>`;
  const d = Math.floor(S.hours / 24) + 1;
  $("clock").textContent = `${S.hours.toFixed(1)} 时 · 第 ${d} 天（${S.speed === 0 ? "暂停" : S.speed + "×"}${S.starving ? " · 缺粮减速" : ""}${S.mobilized ? " · 战备" : ""}）`;
}
function renderSites() {
  $("sites").innerHTML = Object.entries(SITES).map(([s, r]) => {
    const K = k(); const pct = Math.min(1, S.buf[s] / K.buf);
    return `<div class="site ${pct >= 1 ? "full" : ""}">
      <span class="nm">${s}→${r}</span> 缓冲 ${S.buf[s].toFixed(1)}
      <div class="bar"><i style="width:${pct * 100}%"></i></div></div>`;
  }).join("");
}

/* ═══════════ 组织图（节点卡 + SVG 三类边） ═══════════ */
function renderGraph() {
  const wrap = $("graphWrap"), nodesEl = $("nodes");
  nodesEl.innerHTML = "";
  const COLS = 4, W = 244, X0 = 20, Y0 = 20, GAPY = 26;
  const list = S.order.filter(id => S.orgs[id]);
  // 分行：第 0 行 = 市政厅（居中），其后每 COLS 个一行
  const rows = [];
  if (list.length) rows.push([list[0]]);
  for (let i = 1; i < list.length; i += COLS) rows.push(list.slice(i, i + COLS));
  const els = {}, metas = [];
  let y = Y0;
  for (const row of rows) {
    const offset = row.length < COLS ? (COLS - row.length) * W / 2 : 0;
    let maxH = 0;
    const rowMetas = [];
    row.forEach((id, ci) => {
      const o = S.orgs[id];
      const el = orgCard(o, X0 + offset + ci * W, y);
      nodesEl.appendChild(el); els[id] = el;
      rowMetas.push({ o });
      maxH = Math.max(maxH, el.offsetHeight || 100);
    });
    metas.push(...rowMetas);
    y += maxH + GAPY;
  }
  drawEdges(metas, els, wrap);
}
function orgCard(o, x, y) {
  const el = document.createElement("div");
  el.className = "org " + (o.kind === "hall" ? "hall" : "") + (S.sel === o.id ? "sel" : "");
  el.dataset.id = o.id; el.style.left = x + "px"; el.style.top = y + "px";
  let h = `<div class="hd">${o.name}${o.kind === "hall" ? " <span style='color:var(--warn);font-size:11px'>领导＝你</span>" : ""}
           <span class="tier">L${o.tier}</span><button class="del warn" data-del="${o.id}">×</button></div>`;
  const fns = Object.keys(o.slots);
  if (!fns.length) h += `<div class="ft">无职能槽（右侧加槽）</div>`;
  for (const fn of fns) {
    const slot = o.slots[fn];
    const cls = FNS[fn]?.hall ? "hall" : (FNS[fn]?.cat === "军事" ? "mil" : "");
    let content;
    if (slot.institution) content = `<span class="chip orgchip">机构·${S.orgs[slot.institution]?.name || "?"}</span>`;
    else content = slot.persons.length
      ? slot.persons.map(p => `<span class="chip">${person(p)?.name || "?"}</span>`).join(" ")
      : `<span class="chip empty">空槽</span>`;
    const par = FNS[fn]?.paramSite ? `<span class="par">${slot.site || ""}</span>`
      : FNS[fn]?.input ? `<span class="par">${fnDesc(fn)}</span>` : "";
    h += `<div class="slotrow ${S.sel === o.id && S.selSlot === fn ? "sel" : ""}" data-org="${o.id}" data-fn="${fn}">
          <span class="fn ${cls}">${fn}</span> ${content} ${par}</div>`;
  }
  h += `<div class="ft"><span>在编 ${membersOf(o)} 人</span>${o.kind === "hall" ? "<span>全场根节点</span>" : ""}</div>`;
  el.innerHTML = h;
  el.addEventListener("click", ev => {
    const del = ev.target.closest("[data-del]");
    if (del) { const org = S.orgs[del.dataset.del];
      for (const slot of Object.values(org.slots)) for (const pid of slot.persons) person(pid).org = "";
      delete S.orgs[org.id]; S.order = S.order.filter(x => x !== org.id);
      for (const other of Object.values(S.orgs)) for (const slot of Object.values(other.slots))
        if (slot.institution === org.id) slot.institution = "";
      feed(`解散 ${org.name}`); S.sel = null; renderAll(); return; }
    const row = ev.target.closest(".slotrow");
    S.sel = o.id; S.selSlot = row ? row.dataset.fn : null;
    renderAll();
  });
  return el;
}
function drawEdges(metas, els, wrap) {
  const svg = $("edges");
  svg.setAttribute("width", wrap.scrollWidth); svg.setAttribute("height", wrap.scrollHeight);
  const byId = {}; for (const m of metas) byId[m.o.id] = m;
  const rect = id => els[id];
  let defs = `<defs>
    <marker id="arrFlow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4faee3"/></marker>
    <marker id="arrNest" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#e359c4"/></marker>
  </defs>`;
  const lines = [defs];
  // 1) 嵌套（机构 → 宿主槽）：品红虚线箭头——下辖也是嵌套（组织入驻市政厅槽）
  for (const m of metas) for (const [fn, slot] of Object.entries(m.o.slots)) {
    if (!slot.institution || !byId[slot.institution]) continue;
    const a = anchor(slot.institution, "right"), b = slotAnchor(m.o.id, fn);
    lines.push(`<path d="M${a.x},${a.y} C${a.x + 70},${a.y} ${b.x - 70},${b.y} ${b.x},${b.y}"
      fill="none" stroke="#e359c4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrNest)"/>
      <text x="${Math.max(30, (a.x + b.x) / 2)}" y="${(a.y + b.y) / 2 - 5}" fill="#e359c4" font-size="10" text-anchor="middle">嵌套·${fn}</text>`);
  }
  // 3) 制造上下游（产出方 → 消费方，按制品标注）：蓝实线
  const producedBy = {};   // 资源 → [orgId]
  const consumedBy = {};
  for (const m of metas) for (const [fn, slot] of Object.entries(m.o.slots)) {
    const d = FNS[fn]; if (!d?.input) continue;
    for (const r of Object.keys(d.output)) (producedBy[r] ||= []).push(m.o.id);
    for (const r of Object.keys(d.input)) (consumedBy[r] ||= []).push(m.o.id);
  }
  const seen = new Set();
  for (const [res, consumers] of Object.entries(consumedBy)) {
    for (const c of consumers) for (const p of (producedBy[res] || [])) {
      if (p === c) continue;
      const key = p + ">" + c + ":" + res; if (seen.has(key)) continue; seen.add(key);
      const a = anchor(p, "left"), b = anchor(c, "left");
      lines.push(`<path d="M${a.x},${a.y + 8} C${a.x - 46},${a.y + 40} ${b.x - 46},${b.y - 20} ${b.x},${b.y - 6}"
        fill="none" stroke="#4faee3" stroke-width="1.8" marker-end="url(#arrFlow)" opacity="0.9"/>
        <text x="${Math.max(16, Math.min(a.x, b.x) - 34)}" y="${(a.y + b.y) / 2}" fill="#4faee3" font-size="10" text-anchor="middle">${res}</text>`);
    }
  }
  svg.innerHTML = lines.join("");
  function anchor(id, side) {
    const el = rect(id); if (!el) return { x: 0, y: 0 };
    const x = side === "left" ? el.offsetLeft : side === "right" ? el.offsetLeft + el.offsetWidth
      : el.offsetLeft + el.offsetWidth / 2;
    const y = side === "top" ? el.offsetTop : side === "bottom" ? el.offsetTop + el.offsetHeight
      : el.offsetTop + el.offsetHeight / 2;
    return { x, y };
  }
  function slotAnchor(orgId, fn) {
    const el = rect(orgId); const row = wrap.querySelector(`[data-id="${orgId}"] .slotrow[data-fn="${fn}"]`);
    if (!el || !row) return anchor(orgId, "left");
    return { x: el.offsetLeft + el.offsetWidth, y: el.offsetTop + row.offsetTop + row.offsetHeight / 2 };
  }
}

/* ═══════════ 事件流 / 主循环 ═══════════ */
function renderFeed() {
  $("feed").innerHTML = S.feed.slice(-40).map(e =>
    `<div><span class="t">${e.t.toFixed(1)}</span><span class="${e.cls}">${e.text}</span></div>`).join("");
  $("feed").scrollTop = $("feed").scrollHeight;
}
function renderAll() { renderRes(); renderSites(); renderGraph(); renderRight(); renderLeft(); renderFeed(); }
let acc = 0;
setInterval(() => {
  if (S.speed > 0) {
    const dt = 0.1 * S.speed;
    advance(dt); S.hours += dt;
    renderRes(); renderSites();
    acc += 1; if (acc >= 5) {   // 0.5s 一帧重绘图与事件流；左右栏只在交互时重绘（不打断下拉）
      acc = 0; renderGraph(); renderFeed();
      const bp = $("bprog");
      if (bp) bp.textContent = S.buildOrder
        ? `施工中：${S.buildOrder.b} ${(100 * S.buildOrder.done / S.buildOrder.work).toFixed(0)}%` : "";
    }
  }
}, 100);

for (const [id, v] of [["sp0", 0], ["sp1", 1], ["sp10", 10], ["sp100", 100]])
  $(id).onclick = () => { S.speed = v;
    for (const [i2, v2] of [["sp0", 0], ["sp1", 1], ["sp10", 10], ["sp100", 100]])
      $(i2).classList.toggle("on", S.speed === v2); };
$("knobBtn").onclick = () => $("knobs").classList.toggle("show");
$("resetBtn").onclick = () => { reset(); $("feed").innerHTML = ""; renderAll(); };

renderAll();
</script>
