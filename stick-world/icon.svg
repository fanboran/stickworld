<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 火柴人帝国模拟 项目图标：黄金时刻天空 + 暮色山影 + 持旗火柴人（贴纸描边风，
       与主菜单背景/手绘皮肤语言同源） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98f"/>
      <stop offset="0.42" stop-color="#f2a96b"/>
      <stop offset="0.72" stop-color="#a5685f"/>
      <stop offset="1" stop-color="#3a2f47"/>
    </linearGradient>
    <clipPath id="plate">
      <rect x="4" y="4" width="120" height="120" rx="18"/>
    </clipPath>
  </defs>

  <!-- 底板：暖金→暮蓝渐变 + 深墨描边 -->
  <rect x="4" y="4" width="120" height="120" rx="18" fill="url(#sky)" stroke="#241a10" stroke-width="5"/>

  <!-- 暮色山影（裁进圆角板内） -->
  <g clip-path="url(#plate)">
    <path d="M4 100 L30 72 L48 87 L72 62 L98 88 L112 78 L124 92 L124 124 L4 124 Z" fill="#2c2338" opacity="0.9"/>
    <ellipse cx="58" cy="109" rx="24" ry="4.5" fill="#1c1520" opacity="0.5"/>
  </g>

  <!-- 火柴人贴纸描边：深墨底衬一笔，暖白面上一笔 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#26190e" stroke-width="12">
      <path d="M58 54 L58 84"/>
      <path d="M58 62 L42 74"/>
      <path d="M58 60 L80 48"/>
      <path d="M80 48 L80 16"/>
      <path d="M58 84 L46 106"/>
      <path d="M58 84 L70 106"/>
    </g>
    <g stroke="#fdf3dc" stroke-width="6.5">
      <path d="M58 54 L58 84"/>
      <path d="M58 62 L42 74"/>
      <path d="M58 60 L80 48"/>
      <path d="M80 48 L80 16"/>
      <path d="M58 84 L46 106"/>
      <path d="M58 84 L70 106"/>
    </g>
  </g>

  <!-- 头：暖白实底 + 深墨描边 -->
  <circle cx="58" cy="41" r="10" fill="#fdf3dc" stroke="#26190e" stroke-width="4.5"/>

  <!-- 旗：琥珀实底 + 深墨描边（帝国旗） -->
  <path d="M80 16 Q93 16 104 24 Q93 29 80 33 Z" fill="#e8a33d" stroke="#26190e" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
