<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>L3 地区合并/拆分工具</title>
<style>
  :root { --bg:#1c1e24; --panel:#262a33; --line:#3a3f4c; --txt:#d8dce4; --acc:#4da3ff; --ok:#3fbf7f; --warn:#e0a040; --bad:#e06060; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--txt); font: 13px/1.5 "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header .title { font-size: 15px; font-weight: bold; margin-right: 8px; }
  header button, header label.btn { background: #333a46; color: var(--txt); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  header button:hover, header label.btn:hover { background: #3d4554; }
  header button.primary { background: var(--acc); color: #0d1117; border-color: var(--acc); font-weight: bold; }
  header button.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  header button:disabled { opacity: .4; cursor: default; }
  header input[type=file] { display: none; }
  header .mode { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  header .mode span { padding: 4px 10px; cursor: pointer; background: #333a46; user-select: none; }
  header .mode span.on { background: var(--acc); color: #0d1117; font-weight: bold; }
  .hint { font-size: 11px; color: #8a93a3; }
  main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; overflow: hidden; background: #111318; }
  canvas { position: absolute; left: 0; top: 0; }
  #statusBar { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.65); padding: 4px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; }
  aside { width: 320px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside h3 { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 6px; }
  .log-item { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 6px; padding: 6px 8px; background: #2b303b; }
  .log-item .ops { margin-top: 4px; display: flex; gap: 6px; }
  .log-item button { background: #3a4250; color: var(--txt); border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  .log-item .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; margin-right: 4px; }
  .tag.merge { background: #1d4a2e; color: #7fe0a8; }
  .tag.split { background: #4a331d; color: #e8b06a; }
  .colorchip { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; margin-right: 3px; border: 1px solid #666; }
  #selInfo { padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; max-height: 120px; overflow-y: auto; }
  #selInfo .chip { display: inline-block; margin: 2px; padding: 1px 5px; background: #2b303b; border: 1px solid var(--line); border-radius: 3px; }
  #selInfo .chip b { font-family: monospace; }
</style>
</head>
<body>

<header>
  <span class="title">L3 地区划分工具</span>
  <label class="btn">底图(编号图) <input type="file" id="fileBase" accept="image/png"></label>
  <label class="btn">取色图(唯一色) <input type="file" id="fileColor" accept="image/png"></label>
  <label class="btn">color_map.json <input type="file" id="fileMap" accept=".json"></label>
  <span class="hint">已内嵌默认数据，可直接使用；如需覆盖可重新选文件</span>
  <span style="flex:1"></span>
  <div class="mode" id="modeBox">
    <span data-mode="view" class="on">查看</span>
    <span data-mode="merge">合并</span>
    <span data-mode="split">拆分</span>
  </div>
  <button class="primary" id="btnMerge" disabled>合并选区</button>
  <button id="btnClearSel">清空选区</button>
  <button id="btnUndo">撤销</button>
  <button id="btnExport" class="danger">导出 JSON</button>
</header>

<main>
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <div id="statusBar">加载中…</div>
  </div>
  <aside>
    <h3>操作记录</h3>
    <div id="log"><div style="color:#8a93a3;padding:8px">暂无操作</div></div>
    <div id="selInfo"><b>选区：</b>点击地图上的地区以加入选区（合并模式）或标记拆分（拆分模式）</div>
  </aside>
</main>

// ─────────────────────────── 状态 ───────────────────────────
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let baseImg = null;      // 底图（编号图）
let colorImg = null;     // 取色图（唯一色）
let colorPixels = null;  // 取色图原始像素 Uint8ClampedArray（用于 O(1) 取色）
let imgW = 0, imgH = 0;
let labelByColor = {};   // intColor -> label 编号
let colorIndex = [];     // 唯一色数组（int）
let regionInfo = {};     // intColor -> {label, colors:[int], size}

const OCEAN_INT = 0x1e375f;
let scale = 0.5, offX = 0, offY = 0;
let selected = new Set();   // 选中的 intColor（逻辑代表色）
let mergeMap = {};          // 旧色 int -> 新代表色 int
let history = [];           // 操作记录
let mode = 'view';

// 拖动/点击判定
let downX = 0, downY = 0, isDown = false, moved = false;

// ─────────────────────────── 加载 ───────────────────────────
function loadImageSrc(src, cb) {
  const img = new Image();
  img.onload = () => cb(img);
  img.onerror = () => alert('图片加载失败');
  img.src = src;
}
function applyBase(img) { baseImg = img; ensureSize(); fit(); render(); }
function applyColor(img) {
  colorImg = img;
  ensureSize();
  const c = document.createElement('canvas');
  c.width = imgW; c.height = imgH;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0);
  const data = cx.getImageData(0, 0, imgW, imgH).data;
  colorPixels = data;
  buildIndex(data);
  fit();
  render();
}
function applyMap(j) {
  labelByColor = {};
  const labs = (j.labels || {});
  for (const k in labs) labelByColor[parseInt(k, 10)] = parseInt(k, 10);
  // 反查 color -> label（JSON 是 label -> hex）
  const rev = {};
  for (const k in labs) rev[hexToInt(labs[k])] = parseInt(k, 10);
  labelByColor = rev;
  rebuildRegions();
  render();
}
function ensureSize() {
  const w = colorImg ? colorImg.width : (baseImg ? baseImg.width : 0);
  const h = colorImg ? colorImg.height : (baseImg ? baseImg.height : 0);
  if (w && h && (cv.width !== w || cv.height !== h)) { cv.width = w; cv.height = h; }
  imgW = w; imgH = h;
}
function hexToInt(hex) {
  return parseInt(hex.replace('#', ''), 16);
}
function buildIndex(data) {
  const seen = new Set();
  colorIndex = [];
  const n = data.length / 4;
  for (let i = 0; i < n; i++) {
    const c = (data[i*4] << 16) | (data[i*4+1] << 8) | data[i*4+2];
    if (c === OCEAN_INT) continue;
    if (!seen.has(c)) { seen.add(c); colorIndex.push(c); }
  }
  rebuildRegions();
}
function rebuildRegions() {
  if (!colorPixels) return;
  const cnt = {};
  const n = colorPixels.length / 4;
  for (let i = 0; i < n; i++) {
    const c = (colorPixels[i*4] << 16) | (colorPixels[i*4+1] << 8) | colorPixels[i*4+2];
    if (c === OCEAN_INT) continue;
    cnt[c] = (cnt[c] || 0) + 1;
  }
  regionInfo = {};
  for (const c of colorIndex) {
    regionInfo[c] = { label: labelByColor[c] || null, colors: [c], size: cnt[c] || 0 };
  }
  mergeMap = {};
  selected.clear();
  updateSelInfo();
}

// 文件选择
document.getElementById('fileBase').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  loadImageSrc(URL.createObjectURL(f), applyBase);
});
document.getElementById('fileColor').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  loadImageSrc(URL.createObjectURL(f), applyColor);
});
document.getElementById('fileMap').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { applyMap(JSON.parse(r.result)); } catch (err) { alert('JSON 解析失败: ' + err); } };
  r.readAsText(f);
});

// 内嵌自动加载
window.addEventListener('DOMContentLoaded', () => {
  let pending = 0, done = 0;
  const check = () => { done++; if (done >= pending) render(); };
  if (EMBED_BASE) { pending++; loadImageSrc(EMBED_BASE, img => { applyBase(img); check(); }); }
  if (EMBED_COLOR) { pending++; loadImageSrc(EMBED_COLOR, img => { applyColor(img); check(); }); }
  if (EMBED_MAP) { pending++; try { applyMap(EMBED_MAP); } catch (e) { console.error(e); } check(); }
  if (pending === 0) render();
});

// ─────────────────────────── 视图变换 ───────────────────────────
function fit() {
  const wrap = document.getElementById('canvasWrap');
  if (!imgW || !imgH) return;
  scale = Math.min(wrap.clientWidth / imgW, wrap.clientHeight / imgH) * 0.92;
  offX = (wrap.clientWidth - imgW * scale) / 2;
  offY = (wrap.clientHeight - imgH * scale) / 2;
}
function screenToImg(mx, my) {
  return { x: (mx - offX) / scale, y: (my - offY) / scale };
}

// ─────────────────────────── 交互（pointer 事件 + 位移阈值）───────────────────────────
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  isDown = true; moved = false;
  downX = e.clientX; downY = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (isDown) {
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      moved = true;
      offX += dx; offY += dy;
      downX = e.clientX; downY = e.clientY;
      render();
    }
  }
});
cv.addEventListener('pointerup', e => {
  if (!isDown) return;
  isDown = false;
  if (!moved) handleTap(e.clientX, e.clientY);
});

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const old = scale;
  scale = Math.max(0.02, Math.min(20, scale * (e.deltaY < 0 ? 1.15 : 0.87)));
  const k = scale / old;
  offX = mx - (mx - offX) * k;
  offY = my - (my - offY) * k;
  render();
}, { passive: false });

function handleTap(clientX, clientY) {
  if (mode === 'view' || !colorPixels) return;
  const r = cv.getBoundingClientRect();
  const p = screenToImg(clientX - r.left, clientY - r.top);
  const x = Math.round(p.x), y = Math.round(p.y);
  if (x < 0 || y < 0 || x >= imgW || y >= imgH) return;
  const i = (y * imgW + x) * 4;
  const hex = (colorPixels[i] << 16) | (colorPixels[i+1] << 8) | colorPixels[i+2];
  if (hex === OCEAN_INT) { setStatus('海洋区域'); return; }
  const rep = mergeMap[hex] || hex;
  if (mode === 'merge') {
    if (selected.has(rep)) selected.delete(rep); else selected.add(rep);
    updateSelInfo();
    render();
  } else if (mode === 'split') {
    // 拆分：点一下即标记该地区需拆分（由算法 watershed 自然二分，无需画线）
    selected.clear();
    addSplit(rep);
    setStatus('已标记拆分 ' + labelName(rep));
    updateSelInfo();
    render();
  }
}

function logicalColors(rep) {
  const out = [];
  for (const c in mergeMap) if (mergeMap[c] === rep) out.push(parseInt(c, 10));
  if (!out.includes(rep)) out.push(rep);
  return out;
}

// ─────────────────────────── 操作 ───────────────────────────
document.getElementById('btnMerge').addEventListener('click', () => {
  if (selected.size < 2) return;
  const reps = [...selected];
  const newHex = pickFreeColor();
  const oldColors = [];
  for (const rep of reps) {
    for (const c of logicalColors(rep)) { mergeMap[c] = newHex; oldColors.push(c); }
    delete regionInfo[rep];
  }
  regionInfo[newHex] = { label: null, colors: oldColors, size: 0 };
  history.push({ type: 'merge', newHex, oldColors });
  selected.clear();
  updateSelInfo(); render(); updateLog();
});
function addSplit(repHex) {
  const colors = logicalColors(repHex);
  const labels = colors.map(c => labelByColor[c]).filter(v => v != null);
  history.push({ type: 'split', colors, labels, hint: null });
  updateLog();
}
document.getElementById('btnClearSel').addEventListener('click', () => {
  selected.clear();
  updateSelInfo(); render();
});
document.getElementById('btnUndo').addEventListener('click', () => {
  const op = history.pop();
  if (!op) return;
  if (op.type === 'merge') {
    delete regionInfo[op.newHex];
    for (const c of op.oldColors) {
      delete mergeMap[c];
      regionInfo[c] = { label: labelByColor[c] || null, colors: [c], size: 0 };
    }
  }
  updateLog(); render();
});
document.getElementById('btnExport').addEventListener('click', exportJSON);

function pickFreeColor() {
  for (let i = 0; i < 500; i++) {
    const h = (i * 0.618) % 1, s = 0.75, l = 0.55;
    const c = hslInt(h, s, l);
    if (!regionInfo[c] && !(c in mergeMap)) return c;
  }
  return 0xff00ff;
}
function hslInt(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h * 6) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 1/6) [r,g,b] = [c,x,0];
  else if (h < 2/6) [r,g,b] = [x,c,0];
  else if (h < 3/6) [r,g,b] = [0,c,x];
  else if (h < 4/6) [r,g,b] = [0,x,c];
  else if (h < 5/6) [r,g,b] = [x,0,c];
  else [r,g,b] = [c,0,x];
  return (Math.round((r+m)*255) << 16) | (Math.round((g+m)*255) << 8) | Math.round((b+m)*255);
}

// ─────────────────────────── 渲染（半透明高亮层 + alpha 混合）───────────────────────────
let overlayCanvas = null;  // 选中区域半透明覆盖层（仅选中像素有色，其余透明）
let overlayVersion = '';
function buildOverlay() {
  if (!colorPixels) return;
  const selSet = new Set();
  for (const rep of selected) for (const c of logicalColors(rep)) selSet.add(c);
  const key = [...selSet].sort((a,b)=>a-b).join(',');
  if (key === overlayVersion && overlayCanvas) return;
  overlayVersion = key;
  overlayCanvas = document.createElement('canvas');
  overlayCanvas.width = imgW; overlayCanvas.height = imgH;
  const oc = overlayCanvas.getContext('2d');
  const img = oc.createImageData(imgW, imgH);
  const hd = img.data, d = colorPixels;
  const n = d.length / 4;
  // 仅选中像素写半透明高亮色；其余保持透明（不触碰底图）
  for (let i = 0; i < n; i++) {
    const c = (d[i*4] << 16) | (d[i*4+1] << 8) | d[i*4+2];
    if (selSet.has(c)) {
      hd[i*4] = 255; hd[i*4+1] = 190; hd[i*4+2] = 60; hd[i*4+3] = 120;  // 暖橙高亮
    }
  }
  oc.putImageData(img, 0, 0);
}
function render() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!baseImg && !colorImg) { setStatus('未加载图片'); return; }
  // 1. 底图（缩放坐标系）
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  if (baseImg) ctx.drawImage(baseImg, 0, 0);
  else if (colorImg) ctx.drawImage(colorImg, 0, 0);
  // 2. 高亮层：drawImage 做 alpha 混合（底图保持可见，选中区域叠半透明橙）
  if (selected.size > 0 && colorPixels) {
    buildOverlay();
    if (overlayCanvas) ctx.drawImage(overlayCanvas, 0, 0);
  }
  ctx.restore();
  setStatus('缩放 ' + (scale * 100).toFixed(0) + '% ｜ ' + imgW + '×' + imgH +
    ' ｜ 地区 ' + Object.keys(regionInfo).length +
    (selected.size ? ' ｜ 选区 ' + selected.size + ' 个' : ''));
}
function setStatus(s) { document.getElementById('statusBar').textContent = s; }

// ─────────────────────────── 面板 ───────────────────────────
function labelName(c) {
  const l = labelByColor[c];
  return l != null ? 'L' + String(l).padStart(2, '0') : '?';
}
function updateSelInfo() {
  const box = document.getElementById('selInfo');
  const btn = document.getElementById('btnMerge');
  if (selected.size === 0) {
    box.innerHTML = '<b>选区：</b>合并模式点击地区加入选区；拆分模式点击地区即标记（watershed 自然二分）';
    btn.disabled = true;
    return;
  }
  let html = '<b>选区（' + selected.size + '）：</b>';
  for (const rep of selected) {
    html += '<span class="chip"><span class="colorchip" style="background:#' + rep.toString(16).padStart(6,'0') + '"></span>' +
            '<b>' + labelName(rep) + '</b></span>';
  }
  box.innerHTML = html;
  btn.disabled = selected.size < 2;
}
function updateLog() {
  const box = document.getElementById('log');
  if (history.length === 0) { box.innerHTML = '<div style="color:#8a93a3;padding:8px">暂无操作</div>'; return; }
  box.innerHTML = '';
  history.forEach(op => {
    const div = document.createElement('div');
    div.className = 'log-item';
    if (op.type === 'merge') {
      const chips = op.oldColors.map(c =>
        '<span class="colorchip" style="background:#' + c.toString(16).padStart(6,'0') + '"></span>' + labelName(c)).join(' ');
      div.innerHTML = '<span class="tag merge">合并</span>' + chips +
        ' <span style="color:#8a93a3">→</span> ' +
        '<span class="colorchip" style="background:#' + op.newHex.toString(16).padStart(6,'0') + '"></span>' + labelName(op.newHex);
    } else {
      const chips = op.colors.map(c =>
        '<span class="colorchip" style="background:#' + c.toString(16).padStart(6,'0') + '"></span>' + labelName(c)).join(' ');
      const hint = op.hint ? '（分割线）' : '';
      div.innerHTML = '<span class="tag split">拆分</span>' + chips + hint;
    }
    box.appendChild(div);
  });
}

// ─────────────────────────── 导出 ───────────────────────────
function exportJSON() {
  const merges = history.filter(o => o.type === 'merge').map(o => ({
    labels: o.oldColors.map(c => labelByColor[c]).filter(v => v != null),
    colors: o.oldColors.map(c => '#' + c.toString(16).padStart(6, '0')),
    target_color: '#' + o.newHex.toString(16).padStart(6, '0'),
  }));
  const splits = history.filter(o => o.type === 'split').map(o => ({
    labels: o.labels,
    colors: o.colors.map(c => '#' + c.toString(16).padStart(6, '0')),
    hint: o.hint,
  }));
  const out = { tool: 'region_merge_tool', ocean: '#1e375f', merges, splits };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'merge_split_plan.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─────────────────────────── 模式切换 ───────────────────────────
document.getElementById('modeBox').addEventListener('click', e => {
  const el = e.target.closest('span[data-mode]');
  if (!el) return;
  mode = el.dataset.mode;
  document.querySelectorAll('#modeBox span').forEach(s => s.classList.toggle('on', s === el));
  selected.clear();
  updateSelInfo(); render();
});
window.addEventListener('resize', () => { fit(); render(); });
</script>
